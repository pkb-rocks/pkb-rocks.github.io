name: Statistics collector checks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'ops/fedora/**'
      - 'release-statistics.mjs'
      - 'plektra/assets/download.js'
      - '.github/workflows/release-stats.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'ops/fedora/**'
      - 'release-statistics.mjs'
      - 'plektra/assets/download.js'
      - '.github/workflows/release-stats.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check collectors and download links
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          node scripts/tests/test-release-statistics.mjs
          node scripts/tests/test-download.mjs
          python3 -m py_compile scripts/run-release-stats.py scripts/piv_bot.py scripts/stats_schedule.py
      - name: Validate systemd units
        run: systemd-analyze --user verify ops/fedora/plektra-stats.service ops/fedora/plektra-stats.timer
