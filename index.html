<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PKB.rocks builds open source tools for physical keyboard devices.">
    <title>PKB.rocks</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0f14; color: #edf8fa; }
      main { width: min(680px, calc(100% - 40px)); padding: 64px 0; }
      .mark { color: #59d7df; font: 700 0.82rem/1.2 ui-monospace, SFMono-Regular, monospace; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 18px 0 16px; font-size: clamp(3rem, 11vw, 6.5rem); line-height: .92; letter-spacing: -.07em; }
      p { max-width: 570px; color: #a9bbc0; font-size: 1.16rem; line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
      a { color: #061013; background: #72e6ec; padding: 11px 16px; border-radius: 9px; font-weight: 700; text-decoration: none; }
      a.secondary { color: #dce9eb; background: #172127; border: 1px solid #2b3a41; }
      a:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">PKB.rocks</div>
      <h1>Plektra</h1>
      <p>Open source input tools for phones with physical keyboards. Plektra continues the work started by Pastiera.</p>
      <nav aria-label="Project links">
        <a href="https://github.com/pkb-rocks/plektra">View Plektra on GitHub</a>
        <a class="secondary" href="https://pastiera.eu/">Pastiera documentation</a>
        <a class="secondary" href="https://pastiera.eu/donate">Support the project</a>
      </nav>
    </main>
  </body>
</html>
